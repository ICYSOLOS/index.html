        * {

        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: "Courier New", monospace;
            color: #00ff66;
        }

        /* MATRIX CANVAS */
        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.35;
        }

        /* DARK OVERLAY */
        .overlay {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(
                    circle at center,
                    rgba(0, 255, 80, 0.06),
                    rgba(0, 0, 0, 0.92) 65%
                );
            z-index: 1;
            pointer-events: none;
        }

        /* SCANLINES */
        .scanlines {
            position: fixed;
            inset: 0;
            z-index: 5;
            pointer-events: none;

            background: repeating-linear-gradient(
                to bottom,
                rgba(255,255,255,0.025) 0px,
                rgba(255,255,255,0.025) 1px,
                transparent 1px,
                transparent 4px

            animation: scan 8s linear infinite;
        }

        @keyframes scan {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(8px);
            }
        }

        /* MAIN TERMINAL */
        .terminal {

                0 0 60px rgba(0, 255, 80, 0.08),
                inset 0 0 40px rgba(0, 255, 80, 0.03);

            backdrop-filter: blur(3px);

            margin: auto;
            top: 50%;
            transform: translateY(-50%);
        }

        /* TERMINAL HEADER */
        .terminal-header {
            display: flex;

            align-items: center;

            border-bottom: 1px solid rgba(0, 255, 100, 0.25);

        /* ACCESS DENIED */
        .title {
            position: relative;

            font-size: clamp(35px, 7vw, 75px);

            color: #ff2020;

            text-shadow:

                0 0 15px #ff2020,

        }

        /* GLITCH */
        .title::before,
        .title::after {
            content: "ACCESS DENIED";

            position: absolute;
            left: 0;
            right: 0;

            overflow: hidden;

            opacity: 0.7;

        .title::before {

                transform: translate(8px, 2px);

                transform: translate(3px, -2px);
            }
        }

        @keyframes glitch2 {

            }

            82% {

            84% {

    <!-- MATRIX -->
    <canvas id="matrix"></canvas>

    <!-- DARK EFFECTS -->
    <div class="overlay"></div>

    <!-- TERMINAL -->
    <main class="terminal">

        <div class="terminal-header">

        </div>

            ACCESS DENIED
        </div>

        <div class="warning">
            ⚠️ Please contact the appropriate person
            for more information.
        </div>

        <div class="leave">
            Or just <strong>LEAVE.</strong> 😈
        </div>

        <div class="status">

            <div class="status-line">
                &gt; SECURITY STATUS:
                <span class="red">BLOCKED</span>
            </div>

            <div class="status-line">
                &gt; AUTHORIZATION:
                <span class="red">REQUIRED</span>
            </div>

            <div class="status-line">

                ONLINE
            </div>

                YOU HAVE BEEN NOTIFIED<span class="cursor"></span>
            </div>

        </div>

    <!-- MATRIX SCRIPT -->
    <script>

        const canvas = document.getElementById("matrix");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        resizeCanvas();

        window.addEventListener("resize", resizeCanvas);

        const characters =
            "アァカサタナハマヤラワ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&@";

        const fontSize = 16;

        let columns = Math.floor(window.innerWidth / fontSize);

        let drops = [];

        function resetDrops() {

            columns = Math.floor(window.innerWidth / fontSize);

            drops = [];

            for (let i = 0; i < columns; i++) {
                drops[i] = Math.random() * -100;
            }
        }

        resetDrops();

        function matrix() {

            ctx.fillStyle = "rgba(0, 0, 0, 0.055)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {

                const char =
                    characters[
                        Math.floor(
                            Math.random() * characters.length
                        )
                    ];

                ctx.fillStyle = "#00ff66";

                ctx.fillText(
                    char,
                    i * fontSize,
                    drops[i] * fontSize
                );

                if (
                    drops[i] * fontSize >
                    canvas.height &&
                    Math.random() > 0.975
                ) {
                    drops[i] = 0;
                }

                drops[i] += 0.75;
            }
        }

        setInterval(matrix, 35);

    </script>

</body>
