<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            padding: 25px;
        }

        .warning {
            max-width: 700px;
        }

        h1 {
            font-size: clamp(2rem, 8vw, 4.5rem);
            margin: 0 0 35px;
            letter-spacing: 2px;
        }

        p {
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            line-height: 1.7;
            margin: 15px 0;
        }

        .leave {
            font-weight: bold;
            font-size: 1.5em;
            letter-spacing: 2px;
        }

        .evil {
            margin-top: 25px;
            font-size: 1.4rem;
        }
    </style>
</head>

<body>
    <main class="warning">
        <h1>⚠️ ACCESS DENIED ⚠️</h1>

        <p>
            Please contact the appropriate person for more information.
        </p>

        <p>
            Or just <span class="leave">LEAVE.</span>
        </p>

        <p class="evil">
            The choice is yours. 😈
        </p>
    </main>
</body>
</html>
